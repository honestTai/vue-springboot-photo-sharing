#项目配置文件
appPhoto:
  file:
    path: D:/system/photo/
    static:
      url: "http://127.0.0.1:7777/api/photo/app/image/"

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 7777
  servlet:
    # 应用的访问路径
    context-path: /api/photo/app/
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # tomcat最大线程数，默认为200
    max-threads: 800
    # Tomcat启动初始化的线程数，默认值25
    min-spare-threads: 30

# 日志配置
logging:
  level:
    com.app.server: debug
    org.springframework: warn

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: dev
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size:  10MB
      # 设置总上传的文件大小
      max-request-size:  20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  #静态图片访问
  mvc:
    static-path-pattern: /image/**
  resources:
    static-locations: file:D:/system/photo/


# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.app.photo.mapper
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

